<!DOCTYPE html>
<html>
<head>
  <title>K8s Agentic Deploy</title>
</head>
<body>

<h2>Deploy con lenguaje natural</h2>

<label>LLM:</label>
<select id="llm_model">
  <option value="llama3.2:3b">Llama 3.2 3B</option>
  <option value="mistral">Mistral 7B</option>
</select>

<br><br>

<input id="input" style="width:300px" placeholder="deploy nginx with 2 replicas">
<button onclick="deploy()">Deploy</button>

<pre id="output"></pre>

<script>
async function deploy() {
  const text = document.getElementById("input").value;
  const llm_model = document.getElementById("llm_model").value;

  const res = await fetch("http://127.0.0.1:8000/deploy", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ text, session_id, llm_model })
  });

  const data = await res.json();

  document.getElementById("output").textContent = JSON.stringify(data, null, 2);
}
</script>

</body>
</html>
